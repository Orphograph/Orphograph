[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orphograph"
version = "0.1.0"
description = "Bitcoin-anchored file timestamping — hash locally, anchor only the fingerprint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Orphograph" }]
keywords = ["timestamping", "bitcoin", "opentimestamps", "provenance", "proof-of-existence"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://orphograph.com"
Source = "https://github.com/Orphograph/Orphograph"

[tool.setuptools]
packages = ["orphograph"]
