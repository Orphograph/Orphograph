# Keeps the SHA-pinned actions/* steps current. Minor and patch bumps arrive
# as one weekly grouped PR; a major bump gets its own PR because it usually
# needs a hand edit too (the public template in integrations/github-action/
# README.md pins the major by tag and tests/test_ci_action_pins.py requires
# docs and workflows to agree). Every SHA change also needs its KNOWN_SHAS
# row added in that test — a bump is red until a human confirms SHA → version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
