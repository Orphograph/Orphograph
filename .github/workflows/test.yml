# CI test gate.
# Safety: this workflow does NOT interpolate any github.event.*, github.head_ref,
# or other untrusted GitHub-event inputs into shell commands. Only static
# strings + the file globs in the repo. Reviewed against
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  fresh-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Check the contributor's actual HEAD, not GitHub's synthetic merge
      # commit (which contains master by construction and would pass vacuously).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require the current origin/master in the feature branch
        run: python3 tools/check_branch_freshness.py --base origin/master

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (cryptography + PyYAML, like deploy.yml)
        run: pip install --upgrade pip && pip install pytest cryptography PyYAML
      - name: Compile check every server module
        run: python3 -m py_compile server/*.py
      - name: Run pytest (same command as the deploy gate)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        # One pytest process covers tests/ PLUS the out-of-tree suites that were
        # run by NO workflow until 2026-08-22 (capture daemon/USB/attest, gate
        # reader, marketplace plugin skill, zk-provenance engine). They share no
        # module names with tests/ (verified), so one interpreter is fine — unlike
        # sdk-python below. zk-provenance stays LAST: its final test mutates
        # ORPHO_DATA_DIR/sys.modules for the process. deploy.yml runs the SAME line;
        # tests/test_repo_hygiene.py asserts every collectible test file is named
        # by some workflow, so the next orphan suite fails CI instead of rotting.
        run: python3 -m pytest tests/ capture/ tools/test_gate_read.py zk-provenance/test_zk_provenance.py -q --ignore=tests/test_biweekly_safety_audit.py

      # sdk-python/ ships its own package ALSO named `orphograph`, distinct from
      # sdk/orphograph, so the two cannot share one pytest process -- they fight
      # over sys.modules["orphograph"] and whichever sys.path entry lands first
      # wins. That is why these 18 tests had never run in CI at all. A separate
      # interpreter is the fix; combining the paths is not.
      - name: Run the sdk-python test suite (separate interpreter, see above)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python3 -m pytest sdk-python/tests/ -q


  sdk-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # `npm test` runs `pretest: tsc` FIRST, and that ordering is the point.
      # test/client.test.ts deliberately imports from dist/ so the tests
      # exercise what a consumer of the published package gets. The hazard is
      # a STALE dist: on 2026-08-20 running `node --test` directly (skipping
      # pretest) produced two phantom "audit D3" failures from a build that
      # predated the fix in src/, while `npm test` passed them. Building in CI
      # is what stops a source/build divergence from being silent.
      - name: Build and test the sdk-node package
        working-directory: sdk-node
        run: npm ci && npm test

  jslint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax-check every frontend JS file
        run: |
          for f in web/*.js; do
            echo "checking $f"
            node --check "$f"
          done

  # NOTE: the standalone verifier roundtrip lived here but was (1) broken — it used
  # an outdated positional CLI (verify.py now takes a `file`/`folder` subcommand) and
  # no inclusion-proof/manifest sample ships in examples/sample (only a receipt + .ots);
  # and (2) redundant — tests/test_dist_verifier.py already invokes dist/orphograph-verify/
  # verify.py as a subprocess against freshly-built folder-manifest AND inclusion-proof
  # fixtures (folder OK, tamper-detect, file mode), and runs in the pytest job above.
