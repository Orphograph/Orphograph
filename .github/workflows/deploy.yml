name: Deploy to Fly.io

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'press/**'
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install OPTIONAL deps so test_manifest_signature.py (cryptography) and
      # test_verticals.py (PyYAML) can run. The production image is stdlib-only
      # — server/app.py wraps these imports in try/except so prod stays up
      # without them, but CI exercises the full code path.
      - run: pip install --upgrade pip && pip install pytest cryptography PyYAML
      # Same line as test.yml (the deploy gate must not be weaker than CI):
      # tests/ + the out-of-tree suites; zk-provenance last (see test.yml).
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests/ capture/ tools/test_gate_read.py zk-provenance/test_zk_provenance.py -q --ignore=tests/test_biweekly_safety_audit.py
      # sdk-python needs its own interpreter (module-name clash with sdk/), same as test.yml.
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest sdk-python/tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # AUTOMATED DEPLOY IS LIVE. Repo variable CI_DEPLOY_ENABLED=true and secret
    # FLY_API_TOKEN are both set, so every push to master whose `test` job
    # passes auto-deploys to production (orphograph.com) via the step below.
    # In practice: merging a PR to master IS a production deploy.
    # To return to manual-only deploys, set CI_DEPLOY_ENABLED=false — the
    # founder can still deploy with local `fly deploy`, or run this workflow
    # on demand via the workflow_dispatch trigger above.
    if: ${{ vars.CI_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --depot=false: Fly's Depot builder service timed out 4x across two runs
      # on 2026-08-31 ("Waiting for depot builder... deadline_exceeded",
      # auth handshake EOF) with no incident on their status page. The classic
      # remote builder machine is the documented fallback. One-line revert
      # when Depot recovers.
      - run: flyctl deploy --remote-only --depot=false --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
