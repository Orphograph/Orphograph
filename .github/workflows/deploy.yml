name: Deploy to Fly.io

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'press/**'
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install OPTIONAL deps so test_manifest_signature.py (cryptography) and
      # test_verticals.py (PyYAML) can run. The production image is stdlib-only
      # — server/app.py wraps these imports in try/except so prod stays up
      # without them, but CI exercises the full code path.
      - run: pip install --upgrade pip && pip install pytest cryptography PyYAML
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests/ -q --ignore=tests/test_biweekly_safety_audit.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
