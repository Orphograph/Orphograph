<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="20%" cy="-10%" r="60%">
      <stop offset="0%" stop-color="#5bdc9b" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#0c0e10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5bdc9b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5bdc9b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0c0e10"/>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- top-left anchor mark -->
  <g transform="translate(70 70)" fill="none" stroke="#5bdc9b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="6" x2="20" y2="40"/>
    <line x1="13" y1="12" x2="27" y2="12"/>
    <path d="M8 30 Q 20 46 32 30"/>
    <circle cx="20" cy="5" r="2"/>
  </g>
  <text x="116" y="100" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" letter-spacing="0.04em" fill="#e7e9ec">orphograph</text>

  <!-- thin separator -->
  <line x1="70" y1="140" x2="1130" y2="140" stroke="url(#line)" stroke-width="1"/>

  <!-- headline -->
  <text x="70" y="270" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="300" letter-spacing="-0.01em" fill="#e7e9ec">
    Prove your art existed
  </text>
  <text x="70" y="350" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="64" font-weight="300" letter-spacing="-0.01em" fill="#e7e9ec">
    before the bots saw it.
  </text>

  <!-- subhead -->
  <text x="70" y="430" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="300" fill="#8a9099">
    Anchor any file to Bitcoin in 10 seconds.
  </text>
  <text x="70" y="465" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="24" font-weight="300" fill="#8a9099">
    Your image never leaves your browser.
  </text>

  <!-- bottom trust strip -->
  <g font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="18" fill="#5bdc9b">
    <text x="70" y="560">✓ Open source</text>
    <text x="250" y="560">✓ No uploads</text>
    <text x="430" y="560">✓ 5 Bitcoin calendars</text>
    <text x="700" y="560">✓ Verifies forever</text>
  </g>

  <!-- corner price -->
  <text x="1080" y="100" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#5bdc9b">
    $7 / 10 anchors
  </text>
</svg>
