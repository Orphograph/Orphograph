<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Orphograph</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png?v=8">
<link rel="stylesheet" href="/style.css?v=2">
<meta name="copyright" content="© 2026 Orphograph. MIT — see /LICENSE">
</head>
<body>

<header>
  <div class="brand"><a href="/">orphograph</a></div>
  <nav><a href="/">home</a></nav>
</header>

<main>
<section class="signin">
  <h1>Sign in</h1>
  <p class="lede">
    We email you a one-time link. No passwords, no account creation step.
    Use the same email you used to subscribe.
  </p>
  <form id="signin-form" class="signin-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button type="submit" id="submit-btn">Email me a link</button>
  </form>
  <p id="signin-msg" class="hint" hidden></p>
</section>
</main>

<footer>
  <small><a href="/">home</a> · <a href="/terms.html">Terms</a> · <a href="/privacy.html">Privacy</a></small>
</footer>

<script src="/signin.js"></script>
<script src="/statusbar.js" defer></script>
<script src="/assets/event.js" defer></script>
</body>
</html>
