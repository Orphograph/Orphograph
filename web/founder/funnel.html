<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orphograph — Founder Funnel Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #0a0e27;
    --card: #161d3c;
    --border: #2a3254;
    --ink: #e8e9f3;
    --muted: #b0b5c8;
    --accent: #6db5fe;
    --good: #6fcf97;
    --warn: #f2c94c;
    --bad:  #eb5757;
  }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; }
  header { border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: baseline; gap: 1rem; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 500; }
  header .ts { color: var(--muted); font-size: 0.85rem; }
  header a { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-left: auto; }
  main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
  .intro {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 1.25rem 1.5rem; margin-bottom: 1.5rem;
  }
  .intro h2 { margin: 0 0 0.5rem 0; font-size: 0.95rem; }
  .intro p { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .token-input { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .token-input input {
    flex: 1; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--ink); font-family: monospace; font-size: 0.85rem;
  }
  .token-input button {
    padding: 0.5rem 1rem; background: var(--accent); color: var(--bg); border: none;
    border-radius: 4px; cursor: pointer; font-weight: 500;
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .val { font-size: 1.8rem; font-weight: 500; margin-top: 0.25rem; }
  .stat .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
  .panel h3 { margin: 0 0 1rem; font-size: 0.95rem; font-weight: 500; }
  .rates { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .rate-row { padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
  .rate-row:last-child { border-bottom: 0; }
  .rate-row .name { font-size: 0.85rem; color: var(--muted); }
  .rate-row .pct { font-size: 1.4rem; font-weight: 500; margin-top: 0.15rem; }
  .rate-row .pct.zero { color: var(--muted); }
  .rate-row .pct.low { color: var(--bad); }
  .rate-row .pct.mid { color: var(--warn); }
  .rate-row .pct.high { color: var(--good); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: right; padding: 0.4rem 0.8rem; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); padding: 1rem 0; }
  .err { color: var(--bad); padding: 0.5rem 0; font-size: 0.9rem; }
  code { background: var(--bg); padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.8em; }
</style>
</head>
<body>

<header>
  <h1>Funnel Dashboard</h1>
  <span class="ts" id="ts"></span>
  <a href="/founder/metrics">→ metrics</a>
  <a href="/founder/admin">→ admin</a>
</header>

<main>

<div class="intro" id="auth-card">
  <h2>Founder authentication</h2>
  <p>Paste your <code>ORPHO_FOUNDER_TOKEN</code> (same one used by other founder pages). Stored in this tab only; never persisted.</p>
  <div class="token-input">
    <input id="token" type="password" placeholder="paste token here, press Load" autocomplete="off" spellcheck="false">
    <button id="load-btn">Load</button>
  </div>
  <div class="err" id="err"></div>
</div>

<div id="content" hidden>
  <div class="stats" id="totals"></div>
  <div class="panel">
    <h3>Conversion rates · last 30 days</h3>
    <div class="rates" id="rates"></div>
  </div>
  <div class="panel">
    <h3>Daily series · last 30 days</h3>
    <div id="series-wrap"></div>
  </div>
  <div class="panel" style="font-size:0.78rem;color:var(--muted)">
    <span id="meta"></span>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // Safe DOM helpers — never use innerHTML with server-supplied data.
  function el(tag, props, children) {
    var n = document.createElement(tag);
    if (props) for (var k in props) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else n.setAttribute(k, props[k]);
    }
    if (children) children.forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  var FUNNEL = [
    ["drop_zone_visible",          "Drop zone visible"],
    ["file_anchored",              "File anchored"],
    ["checkout_clicked",           "Checkout clicked"],
    ["checkout_returned_success",  "Checkout paid"]
  ];
  var RATES = [
    ["visible_to_anchored",  "visible → anchored"],
    ["anchored_to_checkout", "anchored → checkout"],
    ["checkout_to_paid",     "checkout → paid"],
    ["visible_to_paid",      "visible → paid (end-to-end)"]
  ];

  function rateClass(v) {
    return v === 0 ? "zero" : v < 5 ? "low" : v < 25 ? "mid" : "high";
  }

  function paintTotals(totals) {
    var root = $("totals"); clear(root);
    FUNNEL.forEach(function (kv) {
      var v = (totals && totals[kv[0]]) || 0;
      root.appendChild(el("div", {class: "stat"}, [
        el("div", {class: "label", text: kv[1]}),
        el("div", {class: "val", text: v.toLocaleString()}),
        el("div", {class: "sub", text: "30d total"})
      ]));
    });
  }

  function paintRates(rates) {
    var root = $("rates"); clear(root);
    RATES.forEach(function (kv) {
      var v = (rates && rates[kv[0]]) || 0;
      root.appendChild(el("div", {class: "rate-row"}, [
        el("div", {class: "name", text: kv[1]}),
        el("div", {class: "pct " + rateClass(v), text: v.toFixed(1) + "%"})
      ]));
    });
  }

  function paintSeries(series) {
    var root = $("series-wrap"); clear(root);
    if (!series || !series.length) {
      root.appendChild(el("div", {class: "empty", text:
        "no funnel events recorded in the last 30 days yet — visit the site, drop a file, then refresh"}));
      return;
    }
    var tbl = el("table", null, null);
    var thead = el("thead", null, null);
    var headRow = el("tr", null, null);
    headRow.appendChild(el("th", {text: "Date"}));
    FUNNEL.forEach(function (kv) { headRow.appendChild(el("th", {text: kv[1]})); });
    thead.appendChild(headRow); tbl.appendChild(thead);
    var tbody = el("tbody", null, null);
    series.forEach(function (row) {
      var tr = el("tr", null, null);
      tr.appendChild(el("td", {text: String(row.date || "")}));
      FUNNEL.forEach(function (kv) {
        var v = row[kv[0]] || 0;
        tr.appendChild(el("td", {text: v ? String(v) : "—"}));
      });
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    root.appendChild(tbl);
  }

  function paint(data) {
    $("auth-card").hidden = true;
    $("content").hidden = false;
    var ts = String(data.timestamp || "");
    $("ts").textContent = ts ? ("updated " + ts.replace("T", " ").replace("Z", " UTC").substring(0, 19)) : "";
    paintTotals(data.totals_30d);
    paintRates(data.rates_30d_pct);
    paintSeries(data.series_by_day);
    $("meta").textContent =
      "events_scanned=" + (data.events_scanned || 0) +
      " · window=30d · timezone=UTC";
  }

  function load() {
    var t = $("token").value.trim();
    if (!t) { $("err").textContent = "token required"; return; }
    $("err").textContent = "loading…";
    fetch("/api/founder/funnel", { headers: { "X-Orpho-Founder": t } })
      .then(function (r) {
        if (r.status === 404) { throw new Error("404 — token wrong, or ORPHO_FOUNDER_TOKEN not set on server"); }
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .then(function (data) {
        $("err").textContent = "";
        paint(data);
      })
      .catch(function (e) {
        $("err").textContent = String(e.message || e);
      });
  }

  $("load-btn").addEventListener("click", load);
  $("token").addEventListener("keydown", function (e) {
    if (e.key === "Enter") load();
  });
})();
</script>

<script src="/assets/event.js" defer></script>
</body>
</html>
