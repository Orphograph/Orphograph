<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orphograph — Founder Funnel Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png?v=8">
<link rel="stylesheet" href="/founder/funnel.css?v=2">
</head>
<body>

<header>
  <h1>Funnel Dashboard</h1>
  <span class="ts" id="ts"></span>
  <a href="/founder/metrics">→ metrics</a>
  <a href="/founder/admin">→ admin</a>
</header>

<main>

<div class="intro" id="auth-card">
  <h2>Founder authentication</h2>
  <p>Paste your <code>ORPHO_FOUNDER_TOKEN</code> (same one used by other founder pages). Stored in this tab only; never persisted.</p>
  <div class="token-input">
    <input id="token" type="password" placeholder="paste token here, press Load" autocomplete="off" spellcheck="false">
    <button id="load-btn">Load</button>
  </div>
  <div class="err" id="err"></div>
</div>

<div id="content" hidden>
  <div class="stats" id="totals"></div>
  <div class="panel">
    <h3>Conversion rates · last 30 days</h3>
    <div class="rates" id="rates"></div>
  </div>
  <div class="panel">
    <h3>Daily series · last 30 days</h3>
    <div id="series-wrap"></div>
  </div>
  <div class="panel meta-panel">
    <span id="meta"></span>
  </div>
</div>

<script src="/founder/funnel.js?v=1"></script>

<script src="/assets/event.js?v=1" defer></script>
</body>
</html>
