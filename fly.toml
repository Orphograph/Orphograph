# fly.toml app configuration file generated for orphograph on 2026-05-16T03:07:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'orphograph'
primary_region = 'iad'

[build]

[env]
  HOST = '0.0.0.0'
  MIN_CALENDARS_OK = '3'
  ORPHO_DATA_DIR = '/app/data'
  # homepage: fraction of new human visitors served the dark /v2 document at
  # '/' (sticky cookie, bots excluded for SEO stability). '1.0' = dark is the
  # canonical homepage for humans; '0' reverts everyone to cream; '0.5' = A/B.
  ORPHO_AB_HOME = '1.0'
  ORPHO_TRUST_PROXY_HEADERS = '1'
  PORT = '8080'
  # Canonical free tier is 3 anchors / 24h. The legacy RATE_LIMIT_PER_HOUR='10'
  # resolved to 10*24 = 240/day (app.py multiplies the hourly legacy value by
  # 24), far above policy. Set the daily cap directly.
  RATE_LIMIT_PER_DAY = '3'
  RESEND_FROM = 'Orphograph <hello@orphograph.com>'
  SITE_URL = 'https://orphograph.com'

[[mounts]]
  source = 'orphograph_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
