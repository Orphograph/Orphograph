slug: construction
route: /construction/
title: One receipt per visit. Prove any single photo later.
nav_label: Construction
audience: General contractors, superintendents, project managers.

hero:
  headline: One receipt covers a whole day on site. Show one photo later without showing the rest.
  subhead: Each visit's photos are sealed together in one step. Any single image can be proven part of that set on any future date.

what_this_means:
  - Your photos never leave your device.
  - One receipt covers the whole job-site visit.
  - Show one photo later without showing the rest.

how_it_works:
  - Each photo gets a fingerprint — a 64-character code that changes if a single byte of the file changes. The fingerprints are computed on your own machine, not uploaded.
  - The fingerprints for the day are combined into one fingerprint for the whole folder. That combined fingerprint is the only thing the office sees.
  - The combined fingerprint is anchored to the Bitcoin chain. Anyone, on any future date, can confirm the folder existed by the moment of that block — and that a single image was part of it — without ever seeing the other photos.

technical_detail:
  summary: Show the cryptographic detail
  sections:
    - title: The construction folder, as an anchored unit
      body: |
        The natural unit is one folder per job site per day, anchored at end-of-shift. A larger unit — one folder per phase or per milestone — is reasonable when assembling closeout packets. The folder contains every photograph the field crew captured during the visit, ordered by the relative path under which it was filed.

        The office never sees the photographs. The desktop or browser tool computes a SHA-256 fingerprint of each file, binds the file's relative path into a leaf hash under RFC 6962 domain separation, and assembles the leaves into a Merkle tree whose root is submitted to the OpenTimestamps calendars. The bytes of the photographs themselves do not cross the wire.

        The root is then anchored to a Bitcoin block, and an OpenTimestamps proof for that root is delivered back to the contractor. The proof is sufficient, on its own, to demonstrate that the anchored folder existed by the time of the recorded block.
    - title: Selective disclosure in the field
      body: |
        A claim arises months after the slab pour that the rebar spacing was non-compliant on a specific date. The contractor produces the single photograph of the rebar mat under the slab, together with an inclusion proof — approximately log2 N sibling hashes — that demonstrates the image was a leaf of the anchored end-of-day folder for that exact date.

        The remaining contents of the folder are not exposed by the proof. The verifier learns that the disclosed image belonged to the anchored set and learns nothing else about the set's contents.
    - title: What the office records
      body: |
        The office persists, per anchored folder, the Merkle root, the canonical ordering rule applied, the per-leaf relative paths, the per-file SHA-256 digests, the per-file byte sizes, the Bitcoin attestation for the root, and, when supplied, an optional device signature under a did:key identifier or a capture-credential issued under a published trust list.

        Path names and file sizes are visible to the office in the way ordinary receipt metadata is visible. A contractor for whom the path names are themselves sensitive may anchor under a hash-labeled scheme in which the recorded path is the file's own digest.

faq:
  - q: Where do my photos go?
    a: Nowhere. The fingerprints are computed on your own machine. The office only ever sees the combined fingerprint for the folder.
  - q: What does one receipt cover?
    a: One day's photos for one job site, sealed as one set. Per-phase or per-milestone folders are also fine.
  - q: Can I show just one photo later?
    a: Yes. You can disclose a single image and prove it belonged to that day's set, without disclosing any of the other photos.
  - q: What if a photo is altered after anchoring?
    a: A single changed byte produces a different fingerprint, which breaks the proof. Any independent check spots the mismatch.

