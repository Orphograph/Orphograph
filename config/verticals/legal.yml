disclaimer: |
  Orphograph anchors evidence of existence; it does not certify authorship,
  ownership, or legality. Each user retains responsibility for the underlying
  files, their consent to capture, and their handling under applicable law.
  The office is not a law firm, not a regulated medical-records system, not a
  qualified electronic trust service, and not a legal or financial advisor.
  No claim of admissibility under any rule of evidence is asserted; no
  implication is made that the receipt substitutes for chain-of-custody
  affidavits or for the licensed judgement of counsel; independent attorney
  review is required before any productized claim of evidentiary utility.

# Functional adapter spec (P1 of the acceptance-layer thesis): promotes this
# vertical from a landing page into a config-defined adapter onto attest_core's
# canonical record. Adding a vertical = this block, not a new engine.
attestation_profile:
  claim: existence
  subject_kind: folder
  canonicalization: folder-merkle
  disclosure: selective
  accepted_signers:
    - did:key
    - capture-credential
  compliance_mapping:
