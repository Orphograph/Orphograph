slug: legal
route: /matters/
title: One receipt per filing. Prove any single exhibit later.
nav_label: Legal
audience: Solo practitioners and small-firm partners — family law, plaintiff-side personal injury, criminal defense, small-firm litigation.

hero:
  headline: One receipt covers a whole exhibit set. Show one exhibit later without showing the rest.
  subhead: A matter's exhibits as of a filing date are sealed together in one step. Any single exhibit can be proven part of that set on any future date.

what_this_means:
  - Your exhibits never leave your device.
  - One receipt covers the whole exhibit set at the moment of filing.
  - Show one exhibit later without showing the rest.

how_it_works:
  - Each exhibit gets a fingerprint — a 64-character code that changes if a single byte of the file changes. The fingerprints are computed on your own machine, not uploaded.
  - The fingerprints for the filing are combined into one fingerprint for the whole folder. That combined fingerprint is the only thing the office sees.
  - The combined fingerprint is anchored to the Bitcoin chain. Anyone, on any future date, can confirm the folder existed by the moment of that block — and that a single exhibit was part of it — without ever seeing the other exhibits.

technical_detail:
  summary: Show the cryptographic detail
  sections:
    - title: The matter folder, as an anchored unit
      body: |
        The natural unit is one folder per filing, anchored at the moment of filing. The folder contains the documentary exhibits, the photographs, the screenshots, the recordings, and any other artifact the firm intends to introduce in connection with the filing. Successive filings produce successive anchored folders, each one a snapshot of the exhibit set as it stood at that date.

        The desktop or browser tool computes a SHA-256 fingerprint of each artifact, binds the artifact's relative path into a leaf hash, and assembles the leaves into a Merkle tree whose root is submitted to the OpenTimestamps calendars. The artifacts themselves never leave the firm's device.

        For documents the firm considers confidential at the path level, the folder may be anchored under a hash-labeled scheme in which the recorded path is the artifact's own digest, leaving no human-readable filename in the manifest.
    - title: Selective disclosure at trial
      body: |
        Opposing counsel moves to exclude a single text-message screenshot on grounds of post-hoc fabrication. The firm produces an inclusion proof that the screenshot was a leaf of the anchored exhibit folder as of the filing date six months earlier. The remaining exhibits — those not yet introduced, or those that pertain to other strategic threads — are not exposed by the proof.

        The receipt does not establish that the screenshot is genuine; it establishes that the bytes of the screenshot, under the recorded relative path, existed by the time of the recorded Bitcoin block.
    - title: What the office records
      body: |
        The office persists, per anchored filing, the Merkle root, the canonical ordering rule applied, the per-leaf relative paths, the per-file SHA-256 digests, the per-file byte sizes, the Bitcoin attestation for the root, and, when supplied, an optional attorney signature under a did:key identifier or a capture-credential issued under a published trust list. Bar-number metadata, where supplied, is recorded as an attribute on the signature, not as a claim of accreditation by the office.

faq:
  - q: Where do my exhibits go?
    a: Nowhere. The fingerprints are computed on your own machine. The office only ever sees the combined fingerprint for the folder.
  - q: Is this a chain-of-custody affidavit?
    a: No. The receipt records that a particular byte sequence under a particular relative path was anchored by a particular Bitcoin block. The chain-of-custody narrative remains the province of counsel and the witness.
  - q: Can I anchor under sealed or confidential filenames?
    a: Yes. The folder may be anchored under a hash-labeled scheme in which the recorded path is the artifact's own digest, in which case the manifest carries no human-readable filename information at all.
  - q: Does this establish authenticity?
    a: The receipt establishes that the disclosed artifact existed by the time of the recorded Bitcoin block and was a leaf of the anchored set. Authenticity in the evidentiary sense is a separate determination governed by the applicable rules of evidence and the court.

