slug: realestate
route: /listings/
title: One receipt per listing date. Prove any single photo later.
nav_label: Real estate
audience: Listing agents, brokers, and seller's counsel.

hero:
  headline: One receipt covers a whole listing date. Show one photo later without showing the rest.
  subhead: A listing's photographic record as of a stated date is sealed together in one step. Any single image can be proven part of that set on any future date.

what_this_means:
  - Your listing photos never leave your device.
  - One receipt covers the listing as of the chosen anchor date.
  - Show one photo later without showing the rest.

how_it_works:
  - Each image gets a fingerprint — a 64-character code that changes if a single byte of the file changes. The fingerprints are computed on your own machine, not uploaded.
  - The fingerprints for the listing date are combined into one fingerprint for the whole folder. That combined fingerprint is the only thing the office sees.
  - The combined fingerprint is anchored to the Bitcoin chain. Anyone, on any future date, can confirm the folder existed by the moment of that block — and that a single image was part of it — without ever seeing the other photos.

technical_detail:
  summary: Show the cryptographic detail
  sections:
    - title: The listing folder, as an anchored unit
      body: |
        The natural unit is one folder per anchor point in the listing's life — the listing-walk folder, anchored at the moment the listing goes active; the inspection-day folder, anchored at the moment of contract; the closing-day folder, anchored at recordation. The MLS photo set is the typical core; the agent's full walkthrough is the typical superset.

        The desktop or browser tool computes a SHA-256 fingerprint of each image, binds the relative path into a leaf hash, and assembles the leaves into a Merkle tree whose root is submitted to the OpenTimestamps calendars. The images themselves never leave the device.

        Successive anchor points within a single listing produce successive anchored folders. The receipt for each folder records the listing's photographic state as of that anchor point.
    - title: Selective disclosure after closing
      body: |
        Eight months after closing, the buyer alleges that the basement showed a water stain at listing time. The agent produces an inclusion proof for the four basement photographs in the listing-walk folder anchored on the day the listing went active. Other rooms in the seller's house, and the agent's other active listings on the same day, are not exposed by the proof.

        The receipt does not establish that the property was free of defects; it establishes that the disclosed photographs, under the recorded relative paths, were part of the anchored listing-walk set as of the recorded Bitcoin block.
    - title: What the office records
      body: |
        The office persists, per anchored listing folder, the Merkle root, the canonical ordering rule applied, the per-leaf relative paths, the per-file SHA-256 digests, the per-file byte sizes, the Bitcoin attestation for the root, and, when supplied, an optional agent signature under a did:key identifier or a capture-credential issued under a published trust list. Real-estate-license-number metadata, where supplied, is recorded as an attribute on the signature, not as a claim of accreditation by the office.

faq:
  - q: Where do my listing photos go?
    a: Nowhere. The fingerprints are computed on your own machine. The office only ever sees the combined fingerprint for the folder.
  - q: Does this cure a defective disclosure form?
    a: No. The receipt records that a particular set of images existed by the time of the recorded Bitcoin block. The disclosure form itself remains the responsibility of the agent and counsel.
  - q: Can I anchor multiple dates in one listing's life?
    a: Yes. A separate folder may be anchored at any anchor point — listing-walk, inspection day, closing day, or any other date the agent and counsel choose. Each receives its own root and its own Bitcoin attestation.
  - q: Will this integrate with my MLS feed?
    a: The receipt is independent of any MLS data feed. The agent anchors whichever folder represents the listing's photographic state at the chosen anchor point; the receipt is portable and travels with the listing.

